name: Package RA Agent Studio implementation candidate v1.03

on:
  push:
    branches: [implementation-repair-v1_03]
    paths:
      - '.github/workflows/package_candidate_v103.yml'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'compose.yaml'
      - 'pyproject.toml'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run complete Python 3.14.7 regression
        run: |
          mkdir -p evidence
          python -m pytest -q --junitxml=evidence/pytest-junit.xml | tee evidence/pytest-output.txt

      - name: Verify API and single B12 mutation plane
        run: |
          python - <<'PY' | tee evidence/api-control-plane.txt
          from ra_agent_studio.api import app
          from ra_agent_studio.application.operation_catalog import APPLICATION_OPERATION_CATALOG
          assert app.title == "RA Agent Studio"
          post_routes={route.path for route in app.routes if "POST" in getattr(route,"methods",set())}
          assert post_routes == {"/commands"}
          for required in (
              "op:factory:module-revision-create",
              "op:factory:composition-realize",
              "op:factory:candidate-build",
              "op:factory:review-decision-ingest",
              "op:factory:exact-freeze",
              "op:factory:canonical-promote",
              "op:deployment:authorize-deployment",
              "op:deployment:activate-runtime",
              "op:deployment:stop-runtime",
          ):
              assert required in APPLICATION_OPERATION_CATALOG
          print("API_IMPORT_PASS")
          print("B12_SINGLE_MUTATION_CONTROL_PLANE_PASS")
          PY

      - name: Build production container
        run: |
          docker build -t ra-agent-studio:candidate-v1_03 . | tee evidence/docker-build.txt
          docker image inspect ra-agent-studio:candidate-v1_03 --format '{{.Id}}' | tee evidence/docker-image-id.txt

      - name: Record exact source and accepted frozen references
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "candidate=RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03"
            echo "repository=lyonsring-beep/ra-agent-factory-software"
            echo "commit=${GITHUB_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "branch=${GITHUB_REF_NAME}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_number=${GITHUB_RUN_NUMBER}"
            echo "python=$(python --version 2>&1)"
            echo "prior_candidate_v1_02_inner_sha256=4dbe8aec2ab03ffc5761ea85a88fb6b38b0abe43a659877d4b43daca7e6a0704"
            echo "accepted_v102_factory_live_integration_run=35324637522"
            echo "accepted_v102_factory_live_integration_artifact_id=10538791989"
            echo "accepted_v102_factory_live_integration_sha256=6eb21fcb24b9d9a6b68b9b02a332f548116dfcf37afd3fd52f88c97af0130e2d"
            echo "factory_v1_11_commit=bc0568926ef70ea6fa7e5e6cc8287c09e041fb4f"
            echo "factory_v1_11_candidate_sha256=8387b7aa27d39be56a4f1e28ae979f9f233b1f29c196b5339c1b40dd6fdfec7b"
            echo "factory_v1_11_frozen_package_artifact_id=10334979844"
            echo "factory_v1_11_frozen_package_sha256=df04ac7cc938be23d7652fa8424dd50f220ed95941c1e6290e689c04bbaceeaa"
            echo "repair_scope=ST2-B01,ST2-B02,ST2-B03,ST2-B04,ST2-B05"
            echo "architecture_reopen=NO"
            echo "factory_reopen=NO"
            echo "software_freeze=NOT_AUTHORIZED_PENDING_EXTERNAL_REREVIEW"
          } > evidence/IMPLEMENTATION_IDENTITY.txt
          git ls-files | LC_ALL=C sort > evidence/source-files.txt
          git ls-files -s | LC_ALL=C sort > evidence/source-index.txt
          sha256sum evidence/source-files.txt evidence/source-index.txt > evidence/source-manifest.sha256

      - name: Build exact v1.03 review candidate archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT=RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03
          mkdir -p "$ROOT"
          git archive --format=tar HEAD | tar -x -C "$ROOT"
          mkdir -p "$ROOT/evidence/final_internal_acceptance"
          cp -a evidence/. "$ROOT/evidence/final_internal_acceptance/"
          zip -X -r RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03.zip "$ROOT" >/dev/null
          unzip -t RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03.zip | tee evidence/archive-integrity.txt
          sha256sum RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03.zip | tee RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03.sha256
          stat -c '%s' RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03.zip | tee RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03.size

      - name: Upload exact v1.03 implementation candidate
        uses: actions/upload-artifact@v4
        with:
          name: RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03
          path: |
            RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03.zip
            RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03.sha256
            RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_03.size
            evidence/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
