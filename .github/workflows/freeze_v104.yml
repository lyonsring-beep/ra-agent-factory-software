name: Freeze RA Agent Studio implementation v1.04

on:
  push:
    branches: [software-freeze-v1_04]
    paths:
      - '.github/workflows/freeze_v104.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout freeze harness
        uses: actions/checkout@v4

      - name: Download exact approved v1.04 candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_04
          path: approved-candidate
          repository: lyonsring-beep/ra-agent-factory-software
          run-id: 35331887794
          github-token: ${{ github.token }}

      - name: Verify exact approved candidate identity
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=$(find approved-candidate -type f -name 'RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_04.zip' -print -quit)
          test -n "$CANDIDATE"
          echo '046d1a159aae7ace9c1a552f20f37d14b8c19f917d6ab5b027299e1d5acb3929  '"$CANDIDATE" | sha256sum -c -
          test "$(stat -c '%s' "$CANDIDATE")" = "123274"
          unzip -t "$CANDIDATE" | tee candidate-integrity.txt

      - name: Create mechanical software freeze bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p frozen
          CANDIDATE=$(find approved-candidate -type f -name 'RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_04.zip' -print -quit)
          cp "$CANDIDATE" frozen/RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_04.zip
          cat > frozen/SOFTWARE_FREEZE_IDENTITY.txt <<'EOF'
          product=RA Agent Studio
          freeze_version=v1_04
          freeze_status=SOFTWARE_FREEZE_AUTHORIZED_AND_EXECUTED
          approved_candidate=RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_04.zip
          approved_candidate_sha256=046d1a159aae7ace9c1a552f20f37d14b8c19f917d6ab5b027299e1d5acb3929
          approved_candidate_size_bytes=123274
          approved_source_commit=6cd2e99a726893516e31fb8c9c7c4534aa2a46d1
          approved_packaging_run=35331887794
          approved_packaging_artifact_id=10541024669
          approved_packaging_artifact_sha256=68b919a569dbb7d0f316c0d0bf59d8ab8c0edbc6f3a4d5e24e16d836f838744c
          external_review_verdict=PASS
          open_blockers=0
          architecture_reopen=NO
          factory_v1_11_reopen=NO
          implementation_handoff_reopen=NO
          software_freeze=AUTHORIZED
          factory_reference_artifact_id=10334979844
          factory_reference_sha256=df04ac7cc938be23d7652fa8424dd50f220ed95941c1e6290e689c04bbaceeaa
          preserved_factory_live_integration_run=35324637522
          preserved_factory_live_integration_artifact_id=10538791989
          preserved_factory_live_integration_sha256=6eb21fcb24b9d9a6b68b9b02a332f548116dfcf37afd3fd52f88c97af0130e2d
          EOF
          cat > frozen/EXTERNAL_REVIEW_VERDICT.txt <<'EOF'
          PASS — ST2-B03 CLOSED.
          RA Agent Studio Implementation v1.04 is eligible for Software Freeze.
          ST2-B01 CLOSED / preserved.
          ST2-B02 CLOSED / preserved.
          ST2-B03 CLOSED.
          ST2-B04 CLOSED / preserved.
          ST2-B05 CLOSED / preserved.
          New blockers: 0.
          Architecture reopen: NO.
          Factory v1.11 reopen: NO.
          Implementation Handoff reopen: NO.
          Software Freeze: AUTHORIZED / ELIGIBLE.
          EOF
          sha256sum frozen/RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_04.zip frozen/SOFTWARE_FREEZE_IDENTITY.txt frozen/EXTERNAL_REVIEW_VERDICT.txt > frozen/FREEZE_MANIFEST.sha256
          zip -X -r RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN.zip frozen >/dev/null
          unzip -t RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN.zip | tee frozen-archive-integrity.txt
          sha256sum RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN.zip | tee RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN.sha256
          stat -c '%s' RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN.zip | tee RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN.size

      - name: Upload frozen software artifact
        uses: actions/upload-artifact@v4
        with:
          name: RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN
          path: |
            RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN.zip
            RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN.sha256
            RA_AGENT_STUDIO_IMPLEMENTATION_v1_04_FROZEN.size
            frozen/
            candidate-integrity.txt
            frozen-archive-integrity.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
