name: Package RA Agent Studio implementation candidate v1.02

on:
  workflow_dispatch:
    inputs:
      live_integration_run:
        description: Exact successful v1.02 live Factory integration run
        required: true
        type: string
      live_integration_artifact_id:
        description: Exact live integration evidence artifact id
        required: true
        type: string
      live_integration_artifact_sha256:
        description: Exact live integration evidence artifact sha256 digest
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install package and test dependencies
        run: python -m pip install -e '.[test]'

      - name: Run complete Python 3.14.7 regression
        run: |
          mkdir -p evidence
          python -m pytest -q --junitxml=evidence/pytest-junit.xml | tee evidence/pytest-output.txt

      - name: Verify API and closed B12 catalog import
        run: |
          python - <<'PY' | tee evidence/api-import.txt
          from ra_agent_studio.api import app
          from ra_agent_studio.application.operation_catalog import APPLICATION_OPERATION_CATALOG
          assert app.title == "RA Agent Studio"
          assert "op:factory:exact-freeze" in APPLICATION_OPERATION_CATALOG
          assert "op:factory:canonical-promote" in APPLICATION_OPERATION_CATALOG
          assert "op:deployment:authorize-deployment" in APPLICATION_OPERATION_CATALOG
          assert "op:deployment:activate-runtime" in APPLICATION_OPERATION_CATALOG
          print("API_IMPORT_PASS")
          print("B12_CLOSED_OPERATION_CATALOG_PASS")
          PY

      - name: Build production container
        run: |
          docker build -t ra-agent-studio:candidate-v1_02 . | tee evidence/docker-build.txt
          docker image inspect ra-agent-studio:candidate-v1_02 --format '{{.Id}}' | tee evidence/docker-image-id.txt

      - name: Verify exact live-integration provenance inputs
        shell: bash
        env:
          LIVE_RUN: ${{ inputs.live_integration_run }}
          LIVE_ARTIFACT_ID: ${{ inputs.live_integration_artifact_id }}
          LIVE_ARTIFACT_SHA256: ${{ inputs.live_integration_artifact_sha256 }}
        run: |
          set -euo pipefail
          test -n "$LIVE_RUN"
          test -n "$LIVE_ARTIFACT_ID"
          test ${#LIVE_ARTIFACT_SHA256} -eq 64

      - name: Record exact source and frozen-reference identities
        shell: bash
        env:
          LIVE_RUN: ${{ inputs.live_integration_run }}
          LIVE_ARTIFACT_ID: ${{ inputs.live_integration_artifact_id }}
          LIVE_ARTIFACT_SHA256: ${{ inputs.live_integration_artifact_sha256 }}
        run: |
          set -euo pipefail
          {
            echo "candidate=RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02"
            echo "repository=lyonsring-beep/ra-agent-factory-software"
            echo "commit=${GITHUB_SHA}"
            echo "tree=$(git rev-parse HEAD^{tree})"
            echo "branch=${GITHUB_REF_NAME}"
            echo "workflow_run_id=${GITHUB_RUN_ID}"
            echo "workflow_run_number=${GITHUB_RUN_NUMBER}"
            echo "python=$(python --version 2>&1)"
            echo "prior_candidate_v1_01_sha256=8648f3d9e2bd5274c309603527b9219fc4719c32c4fcff2d468555b93c8c4533"
            echo "factory_v1_11_commit=bc0568926ef70ea6fa7e5e6cc8287c09e041fb4f"
            echo "factory_v1_11_candidate_sha256=8387b7aa27d39be56a4f1e28ae979f9f233b1f29c196b5339c1b40dd6fdfec7b"
            echo "factory_v1_11_frozen_package_artifact_id=10334979844"
            echo "factory_v1_11_frozen_package_sha256=df04ac7cc938be23d7652fa8424dd50f220ed95941c1e6290e689c04bbaceeaa"
            echo "live_integration_run=$LIVE_RUN"
            echo "live_integration_artifact_id=$LIVE_ARTIFACT_ID"
            echo "live_integration_artifact_sha256=$LIVE_ARTIFACT_SHA256"
          } > evidence/IMPLEMENTATION_IDENTITY.txt
          git ls-files | LC_ALL=C sort > evidence/source-files.txt
          git ls-files -s | LC_ALL=C sort > evidence/source-index.txt
          sha256sum evidence/source-files.txt evidence/source-index.txt > evidence/source-manifest.sha256

      - name: Build exact v1.02 review candidate archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT=RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02
          mkdir -p "$ROOT"
          git archive --format=tar HEAD | tar -x -C "$ROOT"
          mkdir -p "$ROOT/evidence/final_internal_acceptance"
          cp -a evidence/. "$ROOT/evidence/final_internal_acceptance/"
          zip -X -r RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02.zip "$ROOT" >/dev/null
          unzip -t RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02.zip | tee evidence/archive-integrity.txt
          sha256sum RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02.zip | tee RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02.sha256
          stat -c '%s' RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02.zip | tee RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02.size

      - name: Upload exact v1.02 implementation candidate
        uses: actions/upload-artifact@v4
        with:
          name: RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02
          path: |
            RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02.zip
            RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02.sha256
            RA_AGENT_STUDIO_IMPLEMENTATION_CANDIDATE_v1_02.size
            evidence/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90
