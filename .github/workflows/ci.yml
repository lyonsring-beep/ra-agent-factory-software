name: RA Agent Studio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install 'pytest>=8.4,<9'
      - name: Run tests
        run: python -m pytest -q
