name: RA Agent Studio CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install package and tests
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Import API
        run: python -c "from ra_agent_studio.api import app; assert app.title == 'RA Agent Studio'"
      - name: Build container
        run: docker build -t ra-agent-studio:${{ github.sha }} .
