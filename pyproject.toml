[project]
name = "ra-agent-studio"
version = "0.1.0"
description = "RA Agent Studio software implementation"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
